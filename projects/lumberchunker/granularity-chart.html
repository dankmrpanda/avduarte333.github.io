<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background: #fff;
    }
    
    #chart-container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }
    
    #chart {
      width: 100%;
      height: 560px;
    }
    
    .controls {
      max-width: 900px;
      margin: 16px auto;
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .control-group label {
      font-weight: 600;
      font-size: 14px;
      color: #333;
    }
    
    .control-group select {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }
    
    .control-group select:hover {
      background: #f5f5f5;
    }
    
    .toggle-button {
      display: flex;
      border: 1px solid #ccc;
      border-radius: 4px;
      overflow: hidden;
      background: white;
    }
    
    .toggle-button button {
      padding: 6px 16px;
      border: none;
      background: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      color: #666;
    }
    
    .toggle-button button:hover {
      background: #f5f5f5;
    }
    
    .toggle-button button.active {
      background: #464646;
      color: white;
    }
    
    .toggle-button button:not(:last-child) {
      border-right: 1px solid #ccc;
    }
    
    .note {
      max-width: 900px;
      margin: 8px auto;
      font-size: 0.9rem;
      color: #444;
      text-align: center;
    }
    
    .axis-label {
      font-size: 13px;
      font-weight: 600;
    }
    
    .chart-title {
      font-size: 16px;
      font-weight: 600;
    }
    
    .method-label {
      font-size: 11px;
      font-weight: 500;
    }
    
    .annotation-text {
      font-size: 11px;
      fill: #666;
    }
    
    .reference-line {
      stroke: #888;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
    }
    
    .tooltip {
      position: absolute;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="chart-container">
    <div class="controls">
      <div class="control-group">
        <label>Metric:</label>
        <div class="toggle-button">
          <button id="dcg-btn" class="active">DCG</button>
          <button id="recall-btn">Recall</button>
        </div>
      </div>
      <div class="control-group">
        <label for="k-select">k:</label>
        <select id="k-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="20" selected>20</option>
        </select>
      </div>
    </div>
    <svg id="chart"></svg>
    <div class="note">
      Switch between DCG and Recall, and vary <em>k</em>. Notice LumberChunker's lead across all settings and its balanced ~334-token granularity. The x-axis uses a logarithmic scale to better visualize the wide range of chunk sizes (12–399 tokens).
    </div>
  </div>
  <div class="tooltip" id="tooltip"></div>

  <script>
    // Data
    const methods = ["Semantic", "Paragraph", "Recursive", "Proposition", "LumberChunker"];
    
    const avgTokens = {
      "Semantic": 185,
      "Paragraph": 79,
      "Recursive": 399,
      "Proposition": 12,
      "LumberChunker": 334
    };
    
    const totalChunks = {
      "Semantic": 191059,
      "Paragraph": 248307,
      "Recursive": 31787,
      "Proposition": 914493,
      "LumberChunker": 36917
    };
    
    const DCG = {
      1:  {Semantic: 29.50, Paragraph: 36.54, Recursive: 39.04, Proposition: 36.91, LumberChunker: 48.28},
      2:  {Semantic: 35.31, Paragraph: 42.11, Recursive: 45.37, Proposition: 42.42, LumberChunker: 54.86},
      5:  {Semantic: 40.67, Paragraph: 45.87, Recursive: 50.66, Proposition: 44.88, LumberChunker: 59.37},
      10: {Semantic: 43.14, Paragraph: 47.72, Recursive: 53.25, Proposition: 45.65, LumberChunker: 60.99},
      20: {Semantic: 44.74, Paragraph: 49.00, Recursive: 54.72, Proposition: 46.19, LumberChunker: 62.09}
    };
    
    const Recall = {
      1:  {Semantic: 29.50, Paragraph: 36.54, Recursive: 39.04, Proposition: 36.91, LumberChunker: 48.28},
      2:  {Semantic: 38.70, Paragraph: 45.37, Recursive: 49.07, Proposition: 45.64, LumberChunker: 58.71},
      5:  {Semantic: 50.60, Paragraph: 53.67, Recursive: 60.64, Proposition: 51.04, LumberChunker: 68.58},
      10: {Semantic: 58.21, Paragraph: 59.34, Recursive: 68.62, Proposition: 53.41, LumberChunker: 73.58},
      20: {Semantic: 64.51, Paragraph: 64.34, Recursive: 74.35, Proposition: 55.54, LumberChunker: 77.92}
    };
    
    const colors = {
      "Semantic": "#4e79a7",
      "Paragraph": "#f28e2c",
      "Recursive": "#e15759",
      "Proposition": "#76b7b2",
      "LumberChunker": "#59a14f"
    };
    
    // Chart setup
    const margin = {top: 60, right: 30, bottom: 70, left: 100};
    const svg = d3.select("#chart");
    const container = document.getElementById("chart-container");
    const width = container.clientWidth - margin.left - margin.right;
    const height = 560 - margin.top - margin.bottom;
    
    svg.attr("width", width + margin.left + margin.right)
       .attr("height", height + margin.top + margin.bottom);
    
    const g = svg.append("g")
                 .attr("transform", `translate(${margin.left},${margin.top})`);
    
    // Scales - using log scale for x-axis to handle wide range
    const xScale = d3.scaleLog().range([0, width]).clamp(true);
    const yScale = d3.scaleLinear().range([height, 0]);
    
    // Axes
    const xAxis = d3.axisBottom(xScale)
                    .ticks(5, "~s")
                    .tickFormat(d => d);
    const yAxis = d3.axisLeft(yScale).ticks(8);
    
    const xAxisG = g.append("g")
                    .attr("class", "x-axis")
                    .attr("transform", `translate(0,${height})`);
    
    const yAxisG = g.append("g")
                    .attr("class", "y-axis");
    
    // Axis labels
    g.append("text")
     .attr("class", "axis-label")
     .attr("text-anchor", "middle")
     .attr("x", width / 2)
     .attr("y", height + 50)
     .text("Average tokens per chunk (log scale)");
    
    // Add subtle note about log scale
    g.append("text")
     .attr("class", "annotation-text")
     .attr("text-anchor", "middle")
     .attr("x", width / 2)
     .attr("y", height + 65)
     .style("font-size", "10px")
     .style("fill", "#888")
     .text("Bubble size represents total chunk count");
    
    const yAxisLabel = g.append("text")
                        .attr("class", "axis-label")
                        .attr("text-anchor", "middle")
                        .attr("transform", "rotate(-90)")
                        .attr("x", -height / 2)
                        .attr("y", -55);
    
    // Title
    const title = g.append("text")
                   .attr("class", "chart-title")
                   .attr("x", 0)
                   .attr("y", -35)
                   .text("Granularity vs. Retrieval Quality — LumberChunker Leads Across k");
    
    // Reference line group
    const refLineG = g.append("g").attr("class", "reference-line-group");
    
    // Tooltip
    const tooltip = d3.select("#tooltip");
    
    // Update function
    function updateChart(metric, k) {
      const data = methods.map(m => ({
        method: m,
        x: avgTokens[m],
        y: (metric === "DCG" ? DCG : Recall)[k][m],
        chunks: totalChunks[m]
      }));
      
      // Update scales - log scale needs positive domain
      const minX = d3.min(data, d => d.x);
      const maxX = d3.max(data, d => d.x);
      xScale.domain([minX * 0.8, maxX * 1.3]);
      yScale.domain([0, d3.max(data, d => d.y) * 1.1]);
      
      // Update axes with transition
      xAxisG.transition().duration(500).call(xAxis);
      yAxisG.transition().duration(500).call(yAxis);
      
      // Update y-axis label
      yAxisLabel.text(`${metric}@${k}`);
      
      // Update reference line (θ ≈ 550) - only show if in visible range
      refLineG.selectAll("*").remove();
      
      const thetaValue = 550;
      if (thetaValue >= xScale.domain()[0] && thetaValue <= xScale.domain()[1]) {
        refLineG.append("line")
                .attr("class", "reference-line")
                .attr("x1", xScale(thetaValue))
                .attr("x2", xScale(thetaValue))
                .attr("y1", 0)
                .attr("y2", height);
        
        refLineG.append("text")
                .attr("class", "annotation-text")
                .attr("x", xScale(thetaValue) + 5)
                .attr("y", 15)
                .text("θ ≈ 550")
                .style("font-weight", "500");
        
        refLineG.append("text")
                .attr("class", "annotation-text")
                .attr("x", xScale(thetaValue) + 5)
                .attr("y", 28)
                .style("font-size", "9px")
                .text("(boundary-finding window)");
      }
      
      // Bind data to circles
      const circles = g.selectAll(".data-circle")
                       .data(data, d => d.method);
      
      // Enter + Update
      const circlesEnter = circles.enter()
                                  .append("circle")
                                  .attr("class", "data-circle")
                                  .attr("cx", d => xScale(d.x))
                                  .attr("cy", d => yScale(d.y))
                                  .attr("r", 0)
                                  .attr("fill", d => colors[d.method])
                                  .attr("opacity", 0.75)
                                  .attr("stroke", "none")
                                  .attr("stroke-width", 0);
      
      circles.merge(circlesEnter)
             .on("mouseover", function(event, d) {
               const baseRadius = Math.min(35, Math.max(8, Math.sqrt(d.chunks) / 25));
               d3.select(this)
                 .transition()
                 .duration(150)
                 .attr("opacity", 1)
                 .attr("r", baseRadius + 3);
               
               tooltip.style("opacity", 1)
                      .html(`<strong>${d.method}</strong><br>` +
                            `Avg tokens: ${d.x}<br>` +
                            `Total #chunks: ${d.chunks.toLocaleString()}<br>` +
                            `${metric}@${k}: ${d.y.toFixed(2)}`)
                      .style("left", (event.pageX + 10) + "px")
                      .style("top", (event.pageY - 10) + "px");
             })
             .on("mouseout", function(event, d) {
               const baseRadius = Math.min(35, Math.max(8, Math.sqrt(d.chunks) / 25));
               d3.select(this)
                 .transition()
                 .duration(150)
                 .attr("opacity", 0.75)
                 .attr("r", baseRadius);
               
               tooltip.style("opacity", 0);
             })
             .transition()
             .duration(500)
             .attr("cx", d => xScale(d.x))
             .attr("cy", d => yScale(d.y))
             .attr("r", d => Math.min(35, Math.max(8, Math.sqrt(d.chunks) / 25)));
      
      circles.exit().remove();
      
      // Bind data to labels
      const labels = g.selectAll(".method-label")
                      .data(data, d => d.method);
      
      const labelsEnter = labels.enter()
                                .append("text")
                                .attr("class", "method-label")
                                .attr("text-anchor", "middle")
                                .attr("x", d => xScale(d.x))
                                .attr("y", d => {
                                  const radius = Math.min(35, Math.max(8, Math.sqrt(d.chunks) / 25));
                                  return yScale(d.y) - radius - 8;
                                })
                                .attr("opacity", 0)
                                .text(d => d.method);
      
      labels.merge(labelsEnter)
            .transition()
            .duration(500)
            .attr("x", d => xScale(d.x))
            .attr("y", d => {
              const radius = Math.min(35, Math.max(8, Math.sqrt(d.chunks) / 25));
              return yScale(d.y) - radius - 8;
            })
            .attr("opacity", 1);
      
      labels.exit().remove();
      
      // Add LumberChunker annotation
      const lcData = data.find(d => d.method === "LumberChunker");
      const lcAnnotation = g.selectAll(".lc-annotation").data([lcData]);
      
      const lcAnnotationEnter = lcAnnotation.enter()
                                            .append("g")
                                            .attr("class", "lc-annotation");
      
      lcAnnotationEnter.append("line")
                       .attr("stroke", "#333")
                       .attr("stroke-width", 1.5)
                       .attr("marker-end", "url(#arrowhead)");
      
      lcAnnotationEnter.append("text")
                       .attr("class", "annotation-text")
                       .attr("text-anchor", "middle")
                       .style("font-weight", "600")
                       .text("LumberChunker (~334 tokens)");
      
      const lcRadius = Math.min(35, Math.max(8, Math.sqrt(lcData.chunks) / 25));
      
      lcAnnotation.merge(lcAnnotationEnter)
                  .select("line")
                  .transition()
                  .duration(500)
                  .attr("x1", xScale(lcData.x))
                  .attr("y1", yScale(lcData.y) - lcRadius - 25)
                  .attr("x2", xScale(lcData.x))
                  .attr("y2", yScale(lcData.y) - lcRadius - 5);
      
      lcAnnotation.merge(lcAnnotationEnter)
                  .select("text")
                  .transition()
                  .duration(500)
                  .attr("x", xScale(lcData.x))
                  .attr("y", yScale(lcData.y) - lcRadius - 30);
    }
    
    // Arrow marker for annotation
    svg.append("defs")
       .append("marker")
       .attr("id", "arrowhead")
       .attr("markerWidth", 10)
       .attr("markerHeight", 10)
       .attr("refX", 5)
       .attr("refY", 3)
       .attr("orient", "auto")
       .append("polygon")
       .attr("points", "0 0, 5 3, 0 6")
       .attr("fill", "#333");
    
    // Event listeners
    let currentMetric = "DCG";
    
    document.getElementById("dcg-btn").addEventListener("click", function() {
      if (currentMetric !== "DCG") {
        currentMetric = "DCG";
        document.getElementById("dcg-btn").classList.add("active");
        document.getElementById("recall-btn").classList.remove("active");
        const k = parseInt(document.getElementById("k-select").value);
        updateChart(currentMetric, k);
      }
    });
    
    document.getElementById("recall-btn").addEventListener("click", function() {
      if (currentMetric !== "Recall") {
        currentMetric = "Recall";
        document.getElementById("recall-btn").classList.add("active");
        document.getElementById("dcg-btn").classList.remove("active");
        const k = parseInt(document.getElementById("k-select").value);
        updateChart(currentMetric, k);
      }
    });
    
    document.getElementById("k-select").addEventListener("change", function() {
      const k = parseInt(this.value);
      updateChart(currentMetric, k);
    });
    
    // Initial render
    updateChart("DCG", 20);
    
    // Responsive resize
    let resizeTimeout;
    window.addEventListener("resize", function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        const newWidth = container.clientWidth - margin.left - margin.right;
        svg.attr("width", newWidth + margin.left + margin.right);
        xScale.range([0, newWidth]);
        
        const k = parseInt(document.getElementById("k-select").value);
        updateChart(currentMetric, k);
      }, 250);
    });
  </script>
</body>
</html>
