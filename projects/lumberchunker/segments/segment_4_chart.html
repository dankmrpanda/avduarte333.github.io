<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LumberChunker: Segment 4 (Bar Chart)</title>
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        #qa-bar-chart-container {
            margin: 2rem auto 1rem auto;
            max-width: 600px;
        }

        #qa-bar-chart-container .chart-title {
            font-weight: 600;
            font-size: 1.15rem;
            color: #fff;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        #qa-bar-chart-container svg {
            display: block;
            margin: 0 auto;
        }

        .qa-bar-tooltip {
            position: fixed;
            background: rgba(30, 30, 30, 0.95) !important;
            color: #fff !important;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px !important;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            z-index: 99999;
        }
    </style>
</head>

<body>
    <!-- Interactive QA Accuracy Bar Chart -->
    <div id="qa-bar-chart-container">
        <p class="chart-title">Downstream QA Accuracy (%)</p>
        <div id="qa-bar-chart"></div>
    </div>

    <!-- Tooltip element -->
    <div class="qa-bar-tooltip" id="qa-tooltip"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const qaData = [
                { method: 'Closed-Book', label: 'Closed-Book', accuracy: 26.43, color: '#8bc34a' },
                { method: 'Open-Book', label: 'Open-Book', accuracy: 37.76, color: '#29b6f6' },
                { method: 'RAG-Recursive', label: 'RAG-Recursive', accuracy: 84.96, color: '#7e57c2' },
                { method: 'RAG-LumberChunker', label: 'RAG-Lumber', accuracy: 88.89, color: '#c8a25c' },
                { method: 'RAG-Manual', label: 'RAG-Manual', accuracy: 90.53, color: '#78909c' }
            ];

            const chartContainer = document.getElementById('qa-bar-chart');
            const tooltip = document.getElementById('qa-tooltip');

            const margin = { top: 30, right: 20, bottom: 100, left: 60 };
            const fullWidth = Math.min(560, chartContainer.clientWidth || 560);
            const fullHeight = 340;
            const width = fullWidth - margin.left - margin.right;
            const height = fullHeight - margin.top - margin.bottom;

            const svg = d3.select('#qa-bar-chart')
                .append('svg')
                .attr('viewBox', `0 0 ${fullWidth} ${fullHeight}`)
                .attr('preserveAspectRatio', 'xMidYMid meet')
                .style('width', '100%')
                .style('max-width', fullWidth + 'px')
                .append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scaleBand()
                .domain(qaData.map(d => d.method))
                .range([0, width])
                .padding(0.35);

            const y = d3.scaleLinear()
                .domain([0, 100])
                .range([height, 0]);

            // Grid lines
            svg.append('g')
                .attr('class', 'grid')
                .selectAll('line')
                .data([20, 40, 60, 80, 100])
                .enter()
                .append('line')
                .attr('x1', 0)
                .attr('x2', width)
                .attr('y1', d => y(d))
                .attr('y2', d => y(d))
                .attr('stroke', '#e8e8e8')
                .attr('stroke-dasharray', '3,3');

            // Y axis
            svg.append('g')
                .call(d3.axisLeft(y).ticks(5).tickFormat(d => d + '%'))
                .selectAll('text')
                .style('font-size', '12px')
                .style('fill', '#666');

            svg.select('.domain').attr('stroke', '#ccc');
            svg.selectAll('.tick line').attr('stroke', '#ccc');

            // Y axis label
            svg.append('text')
                .attr('transform', 'rotate(-90)')
                .attr('y', -45)
                .attr('x', -height / 2)
                .attr('text-anchor', 'middle')
                .style('font-size', '13px')
                .style('fill', '#666')
                .text('Accuracy (%)');

            // Bars with animation
            svg.selectAll('.qa-bar')
                .data(qaData)
                .enter()
                .append('rect')
                .attr('class', 'qa-bar')
                .attr('x', d => x(d.method))
                .attr('y', height)
                .attr('width', x.bandwidth())
                .attr('height', 0)
                .attr('fill', d => d.color)
                .attr('rx', 3)
                .attr('ry', 3)
                .style('cursor', 'pointer')
                .on('mouseenter', function (event, d) {
                    d3.select(this)
                        .transition().duration(150)
                        .attr('opacity', 0.85)
                        .attr('stroke', '#333')
                        .attr('stroke-width', 1.5);
                    tooltip.style.opacity = 1;
                    tooltip.innerHTML = `${d.method}<br>Accuracy: ${d.accuracy}%`;
                })
                .on('mousemove', function (event) {
                    tooltip.style.left = (event.clientX + 15) + 'px';
                    tooltip.style.top = (event.clientY - 70) + 'px';
                })
                .on('mouseleave', function () {
                    d3.select(this)
                        .transition().duration(150)
                        .attr('opacity', 1)
                        .attr('stroke', 'none');
                    tooltip.style.opacity = 0;
                })
                .transition()
                .duration(800)
                .delay((d, i) => i * 120)
                .ease(d3.easeCubicOut)
                .attr('y', d => y(d.accuracy))
                .attr('height', d => height - y(d.accuracy));

            // Value labels on top of bars
            svg.selectAll('.qa-label')
                .data(qaData)
                .enter()
                .append('text')
                .attr('class', 'qa-label')
                .attr('x', d => x(d.method) + x.bandwidth() / 2)
                .attr('y', d => y(d.accuracy) - 8)
                .attr('text-anchor', 'middle')
                .style('font-size', '12px')
                .style('font-weight', '600')
                .style('fill', '#464646')
                .style('opacity', 0)
                .text(d => d.accuracy)
                .transition()
                .duration(400)
                .delay((d, i) => 600 + i * 120)
                .style('opacity', 1);

            // X axis labels
            const xAxisG = svg.append('g')
                .attr('transform', `translate(0,${height})`)
                .call(d3.axisBottom(x).tickSize(0).tickFormat((d, i) => qaData[i].label));

            xAxisG.select('.domain').attr('stroke', '#ccc');

            xAxisG.selectAll('text')
                .style('font-size', '11px')
                .style('fill', '#555')
                .attr('text-anchor', 'end')
                .attr('dx', '-0.5em')
                .attr('dy', '0.5em')
                .attr('transform', 'rotate(-45)');
        });
    </script>
</body>

</html>
